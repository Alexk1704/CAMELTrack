[project]
name = "CamelTrack"
version = "1.0"
description = "Official implementation of CAMELTrack: Context-Aware Multi-cue ExpLoitation for Online Multi-Object Tracking."
authors = [
    {name = "Baptiste Standaert", email = "baptiste.standaert@uclouvain.be"},
    {name = "Victor Joos", email = "victorjoosdtb@gmail.com"},
    {name = "Vladimir Somers", email = "vladimir.somers@uclouvain.be"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # tracking (cameltrack.CAMEL / cameltrack.CAMELTrack); tracklab and KPR are optional, see below
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "scipy",
    "transformers",
    "huggingface_hub",
    "hydra-core",
    "omegaconf",
    "pytorch-lightning",
    "pytorch-metric-learning",
]

[project.optional-dependencies]
# `uv run --extra train tracklab -cn cameltrack` for the upstream workflow
# the full upstream setup: tracklab pipeline, training, and KPR as tracklab's ReID module
train = [
    "tracklab",
    "ordered-set",
    "overrides",
    "wandb",
    "torchmetrics",
    "torchreid@git+https://github.com/victorjoos/keypoint_promptable_reidentification",
]

[project.entry-points.tracklab_plugin]
cameltrack = "cameltrack.utils.config_finder:ConfigFinder"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cameltrack*"]
exclude = []

[tool.setuptools.package-data]
cameltrack = ["configs/*.yaml", "configs/**/*.yaml"]  # found by the tracklab plugin (utils/config_finder.py)
